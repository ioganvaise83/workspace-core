# oauth2-proxy configuration for one DeepSeek Harness instance.
#
# Position: nginx --auth_request--> THIS --OIDC--> Keycloak
#
# This file holds NO secrets. The client secret and the cookie secret are read
# from files (mounted read-only), which is why they cannot leak through Git,
# `docker inspect` or a rendered config. See compose.yaml and README.md.
#
# Option names below were verified against the oauth2-proxy v7.15.6 source
# (pkg/apis/options/*.go), not against blog posts. Where a name differs from what
# older documentation says, the source wins.
#
# Every option is chosen against a threat in docs/security/threat-model.md.

# --- provider --------------------------------------------------------------
provider = "keycloak-oidc"

# Exact issuer URL. It must match Keycloak's KC_HOSTNAME byte for byte, with no
# trailing slash, or OIDC discovery fails on an issuer mismatch.
oidc_issuer_url = "https://keycloak.local:8443/realms/personal-ai"

client_id = "dsh-single-user"
# The client secret is read from a file, verified option `client_secret_file`
# (pkg/apis/options/legacy_options.go). It is NOT an environment variable in this
# release, so a `OAUTH2_PROXY_CLIENT_SECRET_FILE` env would be silently ignored.
client_secret_file = "/run/secrets/oidc-client-secret"

# PKCE on top of the confidential-client flow: defence in depth against code
# interception on the redirect leg.
code_challenge_method = "S256"

# Keycloak puts the client id in `aud` only because the realm template adds an
# audience mapper; this restates the expectation so a misconfigured realm fails
# closed instead of accepting a token minted for another client.
oidc_extra_audiences = ["dsh-single-user"]

# Never relax issuer or nonce verification. Written explicitly so a later edit
# has to contradict a named decision (ADR-4) rather than a default.
insecure_oidc_skip_issuer_verification = false
insecure_oidc_skip_nonce = false

# Trust the local lab CA for the TLS connection to Keycloak. Without this the
# proxy cannot verify keycloak.local, and the tempting "fix" is to disable
# verification — which the project forbids (ADR-16). The file is mounted read-only;
# `use_system_trust_store` stays off so ONLY this CA is accepted, not whatever the
# container image happens to ship.
provider_ca_files = ["/etc/oauth2-proxy/local-ca.crt"]
use_system_trust_store = false

# --- redirect --------------------------------------------------------------
redirect_url = "https://dsh.local/oauth2/callback"

# Only this host may be used as a post-login `rd` target. Without it oauth2-proxy
# is an open redirector after a successful login.
whitelist_domains = ["dsh.local"]

# One provider: skip the intermediate "Sign in with …" button.
skip_provider_button = true

# --- admission (deny by default) ------------------------------------------
# THE allowlist: one subject per line. A user who authenticates but is absent
# here receives 403 and never reaches nginx's application location.
#
# IMPORTANT — read this before changing the next three lines.
#
# `authenticated_emails_file` is matched against the session EMAIL, not the OIDC
# `sub`. Verified in oauth2-proxy v7.15.6: `p.Validator(session.Email)` calls
# `UserMap.IsValid(email)`, and the validator lowercases its argument as an email.
# Putting a `sub` in that file therefore does not deny anyone — it silently
# matches nothing, which is a fail-OPEN mistake.
#
# The real admission gates are therefore:
#
#   1. `allowed_groups` below — an IdP-verified group claim (fail-closed).
#   2. The identity gateway, which re-checks the exact `sub` against its OWN
#      allowlist (`GATEWAY_ALLOWED_SUBJECTS`) before minting any cookie.
#
# It is therefore NOT configured. Pointing it at a file that does not exist makes
# oauth2-proxy exit at start-up (`logger.Fatalf`), and pointing it at our subject
# list would match nothing — worse, it would look like a working control.
#
# Unset is the honest state: admission is the group below, plus the gateway's own
# subject check.
# authenticated_emails_file = "/etc/oauth2-proxy/optional-emails.txt"

# No domain-wide admission. Empty list = do not filter by domain.
email_domains = []

# THE IdP-side gate. A user outside this group is refused by oauth2-proxy before
# nginx proxies anything.
#
# The value must match the claim EXACTLY. The realm mapper uses `full.path=false`,
# so Keycloak emits `dsh-users` with no leading slash; `/dsh-users` would match
# nothing and deny everyone. Verified against the mapper config in
# deploy/identity/config/personal-ai-realm.json.
allowed_groups = ["dsh-users"]

# --- session cookie --------------------------------------------------------
# The `__Host-` prefix makes the browser enforce Secure, Path=/ and no Domain,
# so a downgrade to plain HTTP fails closed at the browser.
cookie_name = "__Host-dsh_oauth2"
# Read from a file rather than the `cookie_secret` value, so the secret never
# appears in this file, in Git, or in `docker inspect`.
cookie_secret_file = "/run/secrets/oauth2-cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Keycloak supports refresh tokens, so the cookie is refreshed while the IdP
# session lives. Revocation at the IdP therefore ends access at the next refresh
# rather than waiting for the cookie to expire (threat T7).
cookie_refresh = "15m"
cookie_expire = "8h"

# Cookie-based store: no Redis to operate. The cookie is encrypted and short.
# Recorded as a deliberate trade-off, not an oversight.
session_store_type = "cookie"

# --- header hygiene (threat T4) -------------------------------------------
# Emit identity as response headers for nginx `auth_request_set` to capture.
set_xauthrequest = true
# Do not forward the OIDC access token upstream: the gateway does not need it and
# it is the most sensitive value in the flow.
pass_access_token = false
pass_authorization_header = false
pass_user_headers = false
# Keep nginx's Host: DSH binds its cookie to the authority the browser used.
pass_host_header = true

# oauth2-proxy sits behind nginx, so it must honour X-Forwarded-* from nginx and
# ONLY from nginx. Without trusted_proxy_ips it trusts any peer that can reach it
# directly — a classic header-spoofing path (threat T4).
reverse_proxy = true
trusted_proxy_ips = ["172.16.0.0/12", "10.0.0.0/8", "192.168.0.0/16"]

# --- listening -------------------------------------------------------------
# Plain HTTP on the internal edge network only; TLS terminates at nginx.
http_address = "0.0.0.0:4180"
metrics_address = "0.0.0.0:44180"

# --- logging ---------------------------------------------------------------
# Request logging includes the path but not the query string; keep it off in
# production so an authorization `code` can never be written to disk (threat T9).
request_logging = false
auth_logging = true
standard_logging = true
logging_filename = "/dev/stderr"
