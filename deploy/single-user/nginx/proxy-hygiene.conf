# Proxy header hygiene — included by every location that proxies upstream.
#
# WHY THIS FILE EXISTS
#
# nginx inherits `proxy_set_header` directives from the enclosing server block
# ONLY when the location declares none of its own. The moment a location adds a
# single `proxy_set_header`, the entire server-level set is discarded. This was
# verified empirically on nginx 1.26.3, not assumed:
#
#   server { proxy_set_header Authorization ""; ... }        # cleared
#   location /a { proxy_set_header X-Thing "v"; ... }        # NOT cleared
#
# The consequence is severe: a client-supplied `Authorization`,
# `X-Forwarded-User`, `X-Auth-Request-Email` or `X-Forwarded-For` would be
# forwarded verbatim to the upstream, defeating both the header hygiene and the
# trusted-proxy logic in oauth2-proxy.
#
# Fixing it by repeating the clears in each location invites drift: one location
# gets a new directive and silently loses its clears. Instead, every proxying
# location includes this file, so the clears are declared exactly once and always
# apply. `deploy/tests/` asserts that each proxying location includes it.
#
# Keep this file free of variables that are location-specific.

# Identity headers: never accept a value from the client. Locations that
# legitimately need one set it explicitly *after* this include.
proxy_set_header X-Auth-Request-User          "";
proxy_set_header X-Auth-Request-Email         "";
proxy_set_header X-Auth-Request-Groups        "";
proxy_set_header X-Auth-Request-Access-Token  "";
proxy_set_header X-Auth-Request-Id            "";

# Forwarding headers: we are the edge. A client-supplied value is a spoof attempt,
# and oauth2-proxy would trust it because nginx is a configured trusted proxy.
proxy_set_header X-Forwarded-User             "";
proxy_set_header X-Forwarded-Email            "";
proxy_set_header X-Forwarded-Access-Token     "";
proxy_set_header Forwarded                    "";

# Standard forwarding values, always set by us and never copied from the client.
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;

# DSH authenticates with cookies. oauth2-proxy must not treat a client bearer
# token as an identity. Drop it in both legs.
proxy_set_header Authorization "";
proxy_set_header Proxy         "";
