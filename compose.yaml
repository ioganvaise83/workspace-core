name: personal-ai-workspace

# Built-in services of the personal AI platform.
#
# Everything a normal user needs comes from `docker compose up -d --build`:
# the harness plus one container per built-in MCP integration. Integrations are
# optional at runtime: the harness boots and stays usable while an integration
# is unconfigured or down.

services:
  harness:
    # Community-maintained image packaging the official @deepseek-ai/dsh runtime.
    # Review the image source before use; update the pinned tag intentionally.
    image: ${DSH_IMAGE:-runzhliu/deepseek-harness:0.2.1-rc.3-r1}
    restart: unless-stopped
    ports:
      # Loopback only. This Web API can execute code.
      - "127.0.0.1:${DSH_PORT:-3080}:3080"
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      GMAIL_MCP_URL: http://gmail-mcp:8765/mcp
      INTEGRATIONS_REGISTRY: /workspace/core/integrations/registry.json
    volumes:
      # Sessions, provider settings, managed credentials and DSH profiles.
      - dsh-home:/home/node/.dsh
      # Work directory is local to this installation; NOT part of public Git.
      - ./runtime/workspace:/workspace
      # Personal Git repo: clone next to workspace-core or set KNOWLEDGE_PATH.
      - ${KNOWLEDGE_PATH:-../workspace-knowledge}:/workspace/knowledge
      # Applications: clone next to workspace-core or set APPS_PATH.
      - ${APPS_PATH:-../workspace-apps}:/workspace/apps
      # Optional corporate CA for outbound HTTPS (model API endpoints). Empty by
      # default; the entrypoint exports NODE_EXTRA_CA_CERTS only when non-empty.
      - ${CUSTOM_CA_PATH:-./integrations/ca/empty-ca.pem}:/home/node/custom-ca.pem:ro
      # Разработка платформы
      - ./compose.yaml:/workspace/core/compose.yaml
      - ./integrations:/workspace/core/integrations
      - ./plugins:/workspace/core/plugins
      - ./scripts:/workspace/core/scripts
      - ./docs:/workspace/core/docs
      - ./.gitignore:/workspace/core/.gitignore
      - ./README.md:/workspace/core/README.md
      - ./docs/templates/agents/global-AGENTS.md:/home/node/.dsh/AGENTS.md:ro
      - ./deploy:/workspace/core/deploy
    # Registers built-in MCP integrations into the DSH profile, then hands over
    # to the image's own entrypoint.
    #
    # tini is invoked explicitly because overriding `entrypoint` drops the
    # image's default `tini --` prefix. Without it the harness would run as PID 1
    # and never reap zombies or forward SIGTERM.
    #
    # `web` must be the first argument: the image entrypoint checks `$1 = web`
    # to decide whether to start the web relay and desktop sidecars.
    #
    # Why override at all: dsh has no environment variable for extra patch
    # overlays, and the image entrypoint accepts none. The bootstrap writes into
    # the profile's own cordis.patch.yml, which DSH applies automatically — so no
    # extra `--patch` argument is needed (passing it explicitly would register
    # every entry twice).
    #
    # It runs on every start: idempotent, and it recreates the registration after
    # `--build`, container recreation, or a fresh dsh-home volume.
    entrypoint:
      - /usr/bin/tini
      - --
      - /bin/sh
      - -c
      - |
        # Register built-in integrations, then hand over to the image entrypoint.
        # Best-effort by design: a registration failure must never stop the
        # harness. The script validates before writing, keeps a backup and exits
        # 0 on every failure path; `|| true` also covers a deleted script.
        node /workspace/core/scripts/bootstrap-integrations.cjs || true
        # Optional corporate CA for outbound HTTPS (model API endpoints behind
        # the same inspecting proxy). The bind mount always exists, so -f -s is
        # what separates a real certificate from the zero-byte placeholder: a
        # directory would pass -s alone and break Node. Verification stays on.
        if [ -f /home/node/custom-ca.pem ] && [ -s /home/node/custom-ca.pem ]; then
          NODE_EXTRA_CA_CERTS=/home/node/custom-ca.pem
          export NODE_EXTRA_CA_CERTS
        fi
        exec /usr/local/bin/deepseek-harness-entrypoint "$@"
      - sh
      - web
      - --patch
      - /opt/deepseek-harness/web.cordis.patch.yml
      - --no-open
    depends_on:
      # Only ordering: the token must exist before either container reads it.
      # No health conditions on purpose — the harness must start even when Gmail
      # is unconfigured, unhealthy or absent.
      mcp-token:
        condition: service_completed_successfully
      gmail-mcp:
        condition: service_started
      # Ordering only, exactly like gmail-mcp above: no health condition, so an
      # unconfigured or broken mail-imap-mcp never blocks the harness. The
      # dependency exists because the harness discovers MCP tools once at start;
      # a server that appears later is only picked up by the reconnect loop,
      # which may already be exhausted.
      mail-token:
        condition: service_completed_successfully
      mail-imap-mcp:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512

  # Built-in integration. Read-only Gmail: search, read threads, list labels,
  # download one attachment. No tool here can send, reply, forward, draft, label
  # or delete mail — enforced twice: the OAuth scope, and the --tools allowlist
  # in integrations/gmail/entrypoint.sh.
  gmail-mcp:
    build:
      context: ./integrations/gmail
      dockerfile: Dockerfile
      # npm install runs behind the corporate TLS-inspecting proxy, so the CA is
      # needed while the layer is built and nowhere afterwards. Requires BuildKit
      # (the default in Docker Desktop and Compose v2); the classic builder
      # rejects build secrets outright.
      secrets:
        - custom-ca
    image: ${GMAIL_MCP_IMAGE:-personal-ai-workspace/gmail-mcp:3.0.0}
    restart: unless-stopped
    # No host ports: reachable only from other services on the compose network.
    expose:
      - "8765"
    environment:
      # Token file written by the bootstrap script onto the dsh-home volume.
      GMAIL_BRIDGE_TOKEN_FILE: /dsh-home/bootstrap/gmail-bridge.token
      GMAIL_MCP_EXPORT_REMOTE_IMAGES: "false"
      GMAIL_MCP_TIMEOUT_MS: "60000"
      MCP_PORT: "8765"
      MCP_HOST: "0.0.0.0"
    volumes:
      # Bootstrap-generated bridge token, read-only.
      - dsh-home:/dsh-home:ro
      # OAuth material stays on the host, outside Git. It is optional: without
      # it the server still starts and simply has no working Gmail calls.
      - ${GMAIL_MCP_AUTH_DIR:-./runtime/gmail/oauth}:/home/node/.gmail-mcp:ro
      # Per-integration local state, outside Git.
      - ./runtime/gmail/state:/home/node/state
      - ./runtime/gmail/downloads:/home/node/downloads
      - ./runtime/gmail/attachments:/home/node/attachments
      # Optional corporate CA for outbound HTTPS. Empty by default; the
      # entrypoint exports NODE_EXTRA_CA_CERTS only when the file is non-empty.
      - ${CUSTOM_CA_PATH:-./integrations/ca/empty-ca.pem}:/home/node/custom-ca.pem:ro
    depends_on:
      mcp-token:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Built-in integration. Read-only IMAP across several mailboxes.
  #
  # Same two independent barriers as gmail-mcp, expressed for IMAP:
  #
  #   1. The tool surface has no write verb at all (see integrations/mail-imap/
  #      src/tools.js). A model cannot call what was never registered.
  #   2. Every IMAP command passes a session guard (src/readonly.js) that refuses
  #      SELECT, STORE, APPEND, COPY, MOVE, EXPUNGE, CLOSE, CREATE, DELETE,
  #      RENAME, SUBSCRIBE and any non-PEEK body fetch. Mailboxes are opened with
  #      EXAMINE, and bodies are fetched with BODY.PEEK, so a read does not even
  #      set \Seen.
  #
  # Credentials: accounts.json plus one password file per account, bind-mounted
  # read-only from the host. No credential is in this file, in the image, or in
  # any tool result.
  mail-imap-mcp:
    build:
      context: ./integrations/mail-imap
      dockerfile: Dockerfile
      # `npm ci` runs behind the corporate TLS-inspecting proxy at build time, so
      # the CA is needed while the layer is built and nowhere afterwards.
      # Requires BuildKit (the default in Docker Desktop and Compose v2).
      secrets:
        - custom-ca
    image: ${MAIL_IMAP_MCP_IMAGE:-personal-ai-workspace/mail-imap-mcp:0.1.0}
    restart: unless-stopped
    # No host ports: reachable only from other services on the compose network.
    expose:
      - "8765"
    environment:
      MCP_PORT: "8765"
      MCP_HOST: "0.0.0.0"
      # Token file written by the mail-token service onto the dsh-home volume.
      MAIL_BRIDGE_TOKEN_FILE: /dsh-home/bootstrap/mail-bridge.token
      # Account list. Optional: without it the server starts and reports zero
      # accounts, which is a valid state, not a failure.
      MAIL_IMAP_ACCOUNTS_FILE: /config/accounts.json
      MAIL_TOOL_TIMEOUT_MS: "60000"
      # Where previews, owner approvals and the operation journal live. This
      # directory is NOT mounted into the harness: that is what makes an approval
      # something the agent cannot produce for itself.
      MAIL_APPROVAL_DIR: /state/approvals
      # When a secret is missing, say which account rather than failing silently.
      NODE_ENV: production
    volumes:
      # Bootstrap-generated bridge token, read-only.
      - dsh-home:/dsh-home:ro
      # Account list, read-only. Optional: the directory may be empty or absent;
      # Docker then creates an empty one and the server reports zero accounts.
      - ${MAIL_IMAP_CONFIG_DIR:-./runtime/mail-imap}:/config:ro
      # One password file per account, read-only. Both the config directory and
      # the secrets directory are git-ignored, and neither is in the image.
      - ${MAIL_IMAP_SECRETS_DIR:-./runtime/mail-imap/secrets}:/run/secrets/mail-imap:ro
      # Previews, approvals and the operation journal. Read-write, because the
      # server records them, and deliberately NOT mounted into the harness.
      - ${MAIL_IMAP_STATE_DIR:-./runtime/mail-imap/state}:/state
      # Optional corporate CA for outbound IMAPS. Empty by default; the
      # entrypoint exports it only when the file is non-empty.
      - ${CUSTOM_CA_PATH:-./integrations/ca/empty-ca.pem}:/home/node/custom-ca.pem:ro
    depends_on:
      mail-token:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The server is stateless: 128 MB is generous for a 5 MB-message cap and a
    # handful of concurrent tool calls, and it bounds a decompression bomb.
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot helper that mints this integration's own bridge token.
  #
  # A separate token from gmail's, for the same reason the repositories are
  # separate: a token leaked from one integration must not open the other. It is
  # the same proven script with a different TOKEN_NAME, so there is one
  # implementation of minting, not two.
  mail-token:
    image: ${DSH_IMAGE:-runzhliu/deepseek-harness:0.2.1-rc.3-r1}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/init-token.sh
    environment:
      TOKEN_DIR: /dsh-home/bootstrap
      TOKEN_NAME: mail-bridge.token
    volumes:
      - dsh-home:/dsh-home
      # The script itself lives in the repository, not in the image.
      - ./scripts/init-token.sh:/usr/local/bin/init-token.sh:ro
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  # One-shot helper that mints the shared bridge token onto the dsh-home volume.
  # It exists because compose starts integrations before the harness, while the
  # token lives on a volume both share: without this, the very first `up` would
  # race and gmail-mcp would exit 1 with "no bridge token".
  mcp-token:
    image: ${DSH_IMAGE:-runzhliu/deepseek-harness:0.2.1-rc.3-r1}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/init-token.sh
    environment:
      TOKEN_DIR: /dsh-home/bootstrap
    volumes:
      - dsh-home:/dsh-home
      # The script itself lives in the repository, not in the image.
      - ./scripts/init-token.sh:/usr/local/bin/init-token.sh:ro
    # Writes to the shared volume, which is owned by the harness uid; running as
    # root keeps the token readable regardless of how the volume was created.
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

# Optional corporate CA (TLS inspection: Kaspersky, Zscaler, a proxy).
#
# The default source is a zero-byte placeholder committed to this repository, so
# the build works untouched for everyone. Set CUSTOM_CA_PATH in `.env` to a PEM
# on the host to use a real certificate. It is never copied into the repository,
# never sent to a registry, and never stored in an image layer: BuildKit mounts
# it for the duration of one RUN and drops it afterwards.
secrets:
  custom-ca:
    file: ${CUSTOM_CA_PATH:-./integrations/ca/empty-ca.pem}

volumes:
  dsh-home:
